name: Build Setup Guide PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/SETUP_GUIDE.md'
      - '.github/workflows/build-setup-guide-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PDF with Pandoc
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            -w /data \
            pandoc/latex:latest \
            -f gfm \
            docs/SETUP_GUIDE.md \
            -o docs/Gmail_Job_Tracker_Setup_Guide.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=0.8in \
            -V fontsize=10pt

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Gmail_Job_Tracker_Setup_Guide.pdf

          if git diff --cached --quiet; then
            echo "PDF is already up to date."
            exit 0
          fi

          git commit -m "Generate printable setup guide PDF [skip ci]"
          git push
