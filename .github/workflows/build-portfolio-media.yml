name: Build Portfolio Media

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_portfolio_media.py.gz.b64'
      - '.github/workflows/build-portfolio-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow reportlab
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Decode media builder
        run: |
          base64 -d tools/build_portfolio_media.py.gz.b64 | gunzip > /tmp/build_portfolio_media.py

      - name: Build professional PDF and animated demo
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: python /tmp/build_portfolio_media.py

      - name: Commit generated portfolio media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo-poster.png assets/job-tracker-animated-demo.mp4 docs/Gmail_Job_Tracker_Professional_Guide.pdf
          if git diff --cached --quiet; then
            echo "No generated media changes."
            exit 0
          fi
          git commit -m "Add professional PDF guide and animated project demo"
          git push
